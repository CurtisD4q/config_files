[main]
shell= /usr/bin/zsh
font= Fira Code:size=13:antialias=true
pad=1x1 center
resize-by-cells=no

[colors]
background= 302838
foreground= e6d6ff
# Terminal background tones
regular0=   3d2f4a
bright0=    7a5a9a
# Errors, exit codes, destructive actions
regular1=   a84d72
bright1=    c46a8f
# Success, active/running states
regular2=   6a5a9a
bright2=    8a7aba
# Warnings, timestamps
regular3=   a878a8
bright3=    c496c4
# Files, directories
regular4=   6a4b86
bright4=    b39ee0
# Core purple — prompts, highlights
regular5=   c7a6ff
bright5=    e6d6ff
# System monitoring, pipes, info
regular6=   7a6e96
bright6=    9a8eb6
# General text, foreground
regular7=   dcd3e8
bright7=    f6f0fb
urls=       c46a8f


[tweak]
font-monospace-warn=no

[scrollback]
lines = 10000
