# ~/.config/kitty/kitty.conf

shell /usr/bin/zsh
font_family Fira Code
font_size 13.0
window_padding_width 4

# Colors
background            #302838
foreground            #e6d6ff

# Black
color0                #3d2f4a
color8                #7a5a9a
# Red (errors)
color1                #a84d72
color9                #c46a8f
# Green (success)
color2                #6a5a9a
color10               #8a7aba
# Yellow (warnings)
color3                #a878a8
color11               #c496c4
# Blue (files)
color4                #6a4b86
color12               #b39ee0
# Magenta (purple/prompts)
color5                #c7a6ff
color13               #e6d6ff
# Cyan (info)
color6                #7a6e96
color14               #9a8eb6
# White (text)
color7                #dcd3e8
color15               #f6f0fb

# URLs
url_color             #c46a8f
url_style             curly

# Scrollback
scrollback_lines      10000

# Window title format - add suffix
title_format {title} - Kitty
